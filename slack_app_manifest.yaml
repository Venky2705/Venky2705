display_information:
  name: Neo
  description: Personal assistant bot that responds to @neo mentions and commands
  background_color: "#2c2d30"
  long_description: "Neo is your personal Slack assistant. Interact with Neo by mentioning @neo in any channel, using the /neo slash command, or sending direct messages. Neo can help with morning briefs, weekly reviews, and various productivity tasks."

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Neo
    always_online: true
  slash_commands:
    - command: /neo
      description: Interact with your personal assistant Neo
      usage_hint: "[command] e.g., morning brief, weekly review, help"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
